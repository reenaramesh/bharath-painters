<style>
  *{box-sizing:border-box}
  body{margin:0;background:#edf3f6;color:#173447;font-family:Arial,sans-serif}
  a{color:inherit}p{margin:0}button{font-family:inherit;cursor:pointer}
  .page{max-width:1024px;margin:24px auto;background:#fff;border:1px solid #d7e4ea;border-radius:16px;overflow:hidden;box-shadow:0 20px 55px #173a4c18}
  .cover{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;min-height:180px;padding:16px 28px 24px;background:linear-gradient(110deg,#14374a,#1d5773 52%,#508398);color:white}
  .photo{display:grid;place-items:center;width:132px;max-width:100%;aspect-ratio:132/145;border:5px solid white;border-radius:16px;background:#e0e9ec;overflow:hidden;color:#596579;font-size:10px;text-align:center;box-shadow:0 4px 12px #00000024}
  .photo img{width:100%;height:100%;object-fit:cover}
  .cover{position:relative;overflow:hidden}.cover-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover>.photo,.cover>.brand{position:relative;z-index:1}.cover:has(.cover-background) .id{background:#173447d9}
  .brand{display:grid;grid-template-columns:224px auto;align-items:center;gap:12px}
  .logo{display:flex;align-items:center;justify-content:center;width:224px;height:80px;padding:12px;border-radius:12px;background:white;color:#1d5773;font-size:14px;font-weight:800;overflow:hidden;overflow-wrap:anywhere}
  .logo img{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain}
  .qr{grid-column:2;grid-row:1;justify-self:center;width:96px;height:96px;padding:10px;border:1px solid #d6e2e8;border-radius:12px;background:white}
  .qr img{width:100%;height:100%;object-fit:contain}
  .id{grid-column:2;grid-row:2;justify-self:center;max-width:100%;overflow-wrap:anywhere;padding:6px 12px;border:1px solid #ffffff4d;border-radius:999px;background:#ffffff1a;font-size:11px;font-weight:700;text-align:center}
  .profile-details{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,max-content);align-items:center;gap:24px;padding:20px 28px}
  .identity,.name{min-width:0}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#31768a;font-weight:800}
  h1{margin:7px 0 4px;font-size:30px;line-height:1.1;overflow-wrap:anywhere}.sub{font-size:14px;color:#607786;overflow-wrap:anywhere}
  .badge{display:inline-block;margin-top:8px;border-radius:99px;background:#e8f5ef;color:#21734d;padding:5px 8px;font-size:10px;font-weight:800}
  .actions{display:flex;flex-wrap:nowrap;min-width:0;gap:8px;overflow-x:auto;padding-bottom:4px}
  .action{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;min-height:44px;border:1px solid #b9d1dc;border-radius:12px;padding:0 16px;text-decoration:none;color:#1d5e7b;font-size:14px;font-weight:700;background:#fff;white-space:nowrap}
  .action svg{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.action.primary{background:#176b9b;color:white;border-color:#176b9b}.action:disabled{opacity:.5;cursor:wait}.action:focus-visible{outline:3px solid #176b9b;outline-offset:2px}
  .mobile-label,.qr-action{display:none}.share-message:empty{display:none}.share-message{margin:0 28px 16px;padding:8px 12px;border-radius:8px;background:#eaf4f8}
  .content{display:grid;grid-template-columns:1fr 1fr;gap:20px;border-top:1px solid #e4edf1;background:#f8fbfc;padding:28px}
  .panel{min-width:0;border:1px solid #dbe7ed;background:white;border-radius:16px;padding:20px}.panel h2{margin:0 0 10px;font-size:16px}.panel h2:not(:first-child){margin-top:21px}
  .muted{font-size:12px;line-height:1.55;color:#6b808b}.facts{display:flex;gap:15px;margin:15px 0;border-block:1px solid #e7eff2;padding:13px 0;text-align:center}.facts>div{flex:1;min-width:0}.facts strong{display:block;font-size:19px;color:#1c5f7c}.facts small{font-size:10px;color:#6b808c}
  .chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{padding:6px 9px;background:#eaf4f8;color:#235c76;border-radius:7px;font-size:11px;font-weight:700}
  .project{display:flex;gap:10px;align-items:flex-start;padding:9px;border:1px solid #edf1f3;border-radius:10px;margin-top:9px}.project img,.project .empty{width:64px;height:56px;border-radius:7px;object-fit:cover;background:#e6eef1;flex:0 0 64px}.project>span:last-child{min-width:0}.project b{display:block;font-size:12px}.project small{display:block;font-size:10px;color:#768c97;line-height:1.4;overflow-wrap:anywhere;margin-top:2px}.project .community{color:#1d5e7b;font-weight:700}
  .reviews{padding:0 28px 20px;background:#f8fbfc;border-top:1px solid #e4edf1}.review-heading{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding-top:20px}.review-heading h2{font-size:16px;margin:0}.review-heading strong{font-size:12px;color:#1c5f7c}.review{display:inline-block;vertical-align:top;width:calc(50% - 8px);margin:12px 8px 0 0;padding:12px;border:1px solid #dbe7ed;border-radius:12px;background:white}.review>div{display:flex;justify-content:space-between;gap:8px;font-size:12px}.review span{color:#ae7600}.review p{font-size:12px;line-height:1.5;color:#607786;margin-top:7px;overflow-wrap:anywhere}
  .findus{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 28px 20px;padding:16px;border:1px solid #dbe7ed;border-radius:16px;background:#f8fbfc}.findus-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#607786;font-weight:800}.findus a{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:white;font-weight:800;font-size:12px;text-decoration:none;box-shadow:0 2px 6px #14374a1f}.findus a.is-long{font-size:9px}
  .foot{padding:14px 28px;color:#7b8b94;font-size:10px;display:flex;justify-content:space-between;gap:10px}
  @media(max-width:767px){.profile-details{grid-template-columns:minmax(0,1fr);gap:16px}}
  @media(max-width:639px){
    .page{margin:0;border:0;border-radius:0;box-shadow:none}.cover{min-height:144px;padding:12px 16px 20px;gap:8px}.photo{width:86px;border-width:3px}.brand{grid-template-columns:96px auto;gap:10px}.logo{width:96px;height:60px;padding:8px;font-size:12px}.qr{width:68px;height:68px;padding:8px}.id{padding:5px 8px;font-size:9px}
    .profile-details{padding:16px 16px 20px}.eyebrow{font-size:9px}h1{font-size:20px}.sub{font-size:12px}.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;overflow:visible}.action{min-width:0;min-height:40px;padding:0 3px;gap:3px;border-radius:8px;font-size:10px}.action svg{width:14px;height:14px}.desktop-label{display:none}.mobile-label{display:inline}.qr-action{display:inline-flex}
    .content{grid-template-columns:minmax(0,1fr);padding:16px;gap:12px}.panel{padding:16px}.facts{gap:4px}.facts strong{font-size:18px}.facts small{font-size:10px}.reviews{padding:0 16px 20px}.review{display:block;width:100%;margin-right:0}.findus{margin:0 16px 16px;padding:12px}.share-message{margin-inline:16px}.foot{padding:12px 16px;flex-wrap:wrap}
  }
</style>
