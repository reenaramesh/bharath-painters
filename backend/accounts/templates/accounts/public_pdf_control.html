{% load app_script %}
<form action="{{ pdf_url }}" method="get" target="_blank" class="action" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">
<label for="public-pdf-script">{% system_copy "PDF Language / Script" %}</label>
<select id="public-pdf-script" name="document_language" style="min-height:40px;max-width:160px;border:1px solid #cbd5e1;border-radius:8px;background:white;padding:6px">
<option value="en" {% if display_script == 'en' %}selected{% endif %}>English</option><option value="te" {% if display_script == 'te' %}selected{% endif %}>తెలుగు</option><option value="kn" {% if display_script == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option><option value="hi" {% if display_script == 'hi' %}selected{% endif %}>हिन्दी</option><option value="ta" {% if display_script == 'ta' %}selected{% endif %}>தமிழ்</option>
</select><button class="action primary" type="submit">{% system_copy "Download PDF" %}</button>
</form>
