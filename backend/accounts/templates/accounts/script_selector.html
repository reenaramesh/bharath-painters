{% load app_script static %}{% selected_script as display_script %}
<style>
@font-face{font-family:BharathTelugu;src:url('{% static "accounts/fonts/NotoSansTelugu.ttf" %}')}@font-face{font-family:BharathKannada;src:url('{% static "accounts/fonts/NotoSansKannada.ttf" %}')}@font-face{font-family:BharathHindi;src:url('{% static "accounts/fonts/NotoSansDevanagari.ttf" %}')}@font-face{font-family:BharathTamil;src:url('{% static "accounts/fonts/NotoSansTamil.ttf" %}')}
{% if display_script == 'te' %}body{font-family:BharathTelugu,BharathKannada,BharathHindi,BharathTamil,Arial,sans-serif!important}{% elif display_script == 'kn' %}body{font-family:BharathKannada,BharathTelugu,BharathHindi,BharathTamil,Arial,sans-serif!important}{% elif display_script == 'hi' %}body{font-family:BharathHindi,BharathTelugu,BharathKannada,BharathTamil,Arial,sans-serif!important}{% elif display_script == 'ta' %}body{font-family:BharathTamil,BharathTelugu,BharathKannada,BharathHindi,Arial,sans-serif!important}{% endif %}
.script-picker{max-width:880px;margin:10px auto;padding:10px 16px;color:#173447;font-size:12px}.script-picker select{min-height:40px;padding:6px 10px;border:1px solid #cbd5e1;border-radius:8px;background:white;color:#173447}.script-picker p{margin:6px 0;overflow-wrap:break-word}
</style>
<div class="script-picker"><form method="get"><label for="public-script">{% system_copy "Language / Script" %}</label> <select id="public-script" name="document_language" onchange="this.form.submit()">
<option value="en" {% if display_script == 'en' %}selected{% endif %}>English</option><option value="te" {% if display_script == 'te' %}selected{% endif %}>తెలుగు</option><option value="kn" {% if display_script == 'kn' %}selected{% endif %}>ಕನ್ನಡ</option><option value="hi" {% if display_script == 'hi' %}selected{% endif %}>हिन्दी</option><option value="ta" {% if display_script == 'ta' %}selected{% endif %}>தமிழ்</option>
</select><noscript><button type="submit">{% system_copy "Apply" %}</button></noscript></form><p>{% system_copy "English words displayed in your selected script." %}</p></div>
